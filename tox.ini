[tox]
minversion = 4.0
# Don't forget to adjust CI when changing this
envlist = py{311,312,313,314,315}, py311-min
skip_missing_interpreters = true

[testenv]
commands = pytest --cov=nb2plots --cov-report=html {posargs:nb2plots/tests}
extras = test

[testenv:py311-min]
# Oldest supported versions of the dependencies, on the oldest supported Python
deps = -rmin-requirements.txt

# Map the Python version set up by GitHub Actions onto the tox environments
# to run.  See .github/workflows/main.yml.
[gh-actions]
python =
    3.11: py311, py311-min
    3.12: py312
    3.13: py313
    3.14: py314
    3.15: py315
